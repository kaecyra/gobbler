name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The version-bump check needs origin/main and the merge base.
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: e2e/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install golangci-lint
        run: make tools
      - name: install e2e dependencies
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: check
        run: make check
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  image:
    # ADR-00013 obligation 1: the production image has no Node runtime and
    # nothing from e2e/; the image is one Go binary plus tesseract (ADR-00002).
    # No new actions: docker is preinstalled on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: build production image
        run: docker build -t gobbler:ci .
      - name: check image contents
        run: bash .github/scripts/check-image.sh gobbler:ci
