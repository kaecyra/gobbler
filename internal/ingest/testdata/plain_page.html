<!doctype html>
<html><head><title>Garlic Spaghetti</title></head>
<body>
<h1>Garlic Spaghetti</h1>
<h2>Ingredients</h2>
<ul>
<li>8 oz spaghetti</li>
<li>3 cloves garlic, minced</li>
<li>1/4 cup olive oil</li>
<li>Salt to taste</li>
</ul>
<h2>Directions</h2>
<ol>
<li>Boil the spaghetti for 10 minutes.</li>
<li>Fry the garlic in the oil until golden, about 2 minutes.</li>
<li>Toss together and serve.</li>
</ol>
</body></html>
