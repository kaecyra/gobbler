# gobbler. cloudflared runs on the VM guest, not in Compose, and reaches
# gobbler at http://127.0.0.1:8080. The port is published on every interface of
# the VM so the monitoring stack can reach the health check (ADR-00027); the
# network, not this file, decides who may connect. The app's identity check,
# the sign-in session (ADR-00030), guards every route except the public paths
# (ADR-00029).
#
# Usage: copy .env.example to .env, fill it in, then
# `docker compose pull && docker compose up -d`.

services:
  gobbler:
    # Published by CI on every merge to main (ADR-00026). Set GOBBLER_VERSION
    # in .env to a version from ghcr.io/kaecyra/gobbler; there is no default.
    image: ghcr.io/kaecyra/gobbler:${GOBBLER_VERSION:?set GOBBLER_VERSION in .env to a published version}
    restart: unless-stopped
    environment:
      # The container's interface must accept the published traffic. Sign-in
      # is the identity: the dev bypass is forced off whatever .env says.
      GOBBLER_LISTEN_ADDR: 0.0.0.0:8080
      GOBBLER_DEV_AUTH_BYPASS: "false"
      GOBBLER_DATA_DIR: /data
      # Every other setting is passed through from .env by name. env_file is
      # not used, so nothing else in .env reaches this container. An empty
      # value counts as unset (internal/config). Add a new setting here too.
      GOBBLER_LOG_LEVEL: ${GOBBLER_LOG_LEVEL:-}
      GOBBLER_OIDC_ISSUER: ${GOBBLER_OIDC_ISSUER:-}
      GOBBLER_OIDC_CLIENT_ID: ${GOBBLER_OIDC_CLIENT_ID:-}
      GOBBLER_OIDC_CLIENT_SECRET: ${GOBBLER_OIDC_CLIENT_SECRET:-}
      GOBBLER_PUBLIC_BASE_URL: ${GOBBLER_PUBLIC_BASE_URL:-}
      GOBBLER_SESSION_LIFETIME: ${GOBBLER_SESSION_LIFETIME:-}
      GOBBLER_OPERATOR_EMAILS: ${GOBBLER_OPERATOR_EMAILS:-}
      GOBBLER_INGEST_CONFIDENCE_THRESHOLD: ${GOBBLER_INGEST_CONFIDENCE_THRESHOLD:-}
      GOBBLER_INGEST_FETCH_TIMEOUT: ${GOBBLER_INGEST_FETCH_TIMEOUT:-}
      GOBBLER_INGEST_USER_AGENT: ${GOBBLER_INGEST_USER_AGENT:-}
      GOBBLER_LLM_PROVIDER: ${GOBBLER_LLM_PROVIDER:-}
      GOBBLER_LLM_TEXT_MODEL: ${GOBBLER_LLM_TEXT_MODEL:-}
      GOBBLER_LLM_VISION_MODEL: ${GOBBLER_LLM_VISION_MODEL:-}
      GOBBLER_LLM_TIMEOUT: ${GOBBLER_LLM_TIMEOUT:-}
      GOBBLER_ANTHROPIC_API_KEY: ${GOBBLER_ANTHROPIC_API_KEY:-}
      GOBBLER_GEMINI_API_KEY: ${GOBBLER_GEMINI_API_KEY:-}
      GOBBLER_BACKUP_SCHEDULE: ${GOBBLER_BACKUP_SCHEDULE:-}
      GOBBLER_BACKUP_LOCAL_RETENTION: ${GOBBLER_BACKUP_LOCAL_RETENTION:-}
      GOBBLER_BACKUP_REMOTE_RETENTION: ${GOBBLER_BACKUP_REMOTE_RETENTION:-}
      GOBBLER_S3_ENDPOINT: ${GOBBLER_S3_ENDPOINT:-}
      GOBBLER_S3_REGION: ${GOBBLER_S3_REGION:-}
      GOBBLER_S3_BUCKET: ${GOBBLER_S3_BUCKET:-}
      GOBBLER_S3_PREFIX: ${GOBBLER_S3_PREFIX:-}
      GOBBLER_S3_ACCESS_KEY_ID: ${GOBBLER_S3_ACCESS_KEY_ID:-}
      GOBBLER_S3_SECRET_ACCESS_KEY: ${GOBBLER_S3_SECRET_ACCESS_KEY:-}
      GOBBLER_S3_MEDIA_BUCKET: ${GOBBLER_S3_MEDIA_BUCKET:-}
      GOBBLER_MCP_RATE: ${GOBBLER_MCP_RATE:-}
      GOBBLER_MCP_BURST: ${GOBBLER_MCP_BURST:-}
      GOBBLER_TRUSTED_PROXIES: ${GOBBLER_TRUSTED_PROXIES:-}
      GOBBLER_OAUTH_REGISTER_RATE: ${GOBBLER_OAUTH_REGISTER_RATE:-}
      GOBBLER_OAUTH_REGISTER_BURST: ${GOBBLER_OAUTH_REGISTER_BURST:-}
      GOBBLER_OAUTH_TOKEN_RATE: ${GOBBLER_OAUTH_TOKEN_RATE:-}
      GOBBLER_OAUTH_TOKEN_BURST: ${GOBBLER_OAUTH_TOKEN_BURST:-}
      GOBBLER_ENCRYPTION_KEY: ${GOBBLER_ENCRYPTION_KEY:-}
    volumes:
      - gobbler-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Holds the SQLite database and <DataDir>/backups (ADR-00010).
  gobbler-data:
